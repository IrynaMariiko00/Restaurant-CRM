name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: restaurant-crm
  IMAGE_NAME: restaurant-crm
  APP_PORT: "3000"
  VITE_API_URL: https://accanto.adammudrak.pp.ua

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Docker image
        if: github.event_name == 'push'
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://accanto.adammudrak.pp.ua' }}
        run: docker build -t "$IMAGE_NAME:latest" --build-arg VITE_API_URL="$VITE_API_URL" .

      - name: Deploy application on Hetzner
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_APP_DEPLOY_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' 'hetzner-portfolio ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMrovpL5gc3TM4fs2+cVTggnYomFUO+ex9st5t1GHlB5' > ~/.ssh/known_hosts
          key="$HOME/.ssh/hetzner_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"

          HETZNER_HOST="$(printf '%s' "$HETZNER_HOST" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          HETZNER_PORT="$(printf '%s' "$HETZNER_PORT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          image="$APP_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:latest" "$image"
          {
            python3 -c 'import json, os, sys; print(json.dumps({key: os.environ[key].strip() for key in sys.argv[1:] if os.environ.get(key, "").strip()}))'
            docker save "$image"
          } | ssh -T -p "$HETZNER_PORT" -i "$key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=hetzner-portfolio -o HostKeyAlgorithms=ssh-ed25519 \
            "root@$HETZNER_HOST" "deploy $GITHUB_SHA"
